spring.application.name=organization

# Database connection values can be supplied by deployment environment variables.
spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:h2:mem:organization}}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Keep the local schema aligned with the JPA entities.
spring.jpa.hibernate.ddl-auto=update
# Use the hosting platform's port when provided, otherwise use Spring's default.
server.port=${PORT:8080}