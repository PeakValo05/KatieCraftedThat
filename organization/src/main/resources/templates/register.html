<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  
   <!-- Back Link -->
        <div class="row">
            <div class="col-12 text-end pt-3" style="padding-right: 15px;">
                <a th:href="@{/login}" class="btn btn-primary" onclick="history.back()">Back</a>
            </div>
        </div>


<!-- Registration Form -->
    <div class="container">
        <div class="row g-4 justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 border-0">
                    <div class="card-body bg-light text-dark d-flex flex-column justify-content-center align-items-center" style="border-radius: 15px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);">
                        <h5 class="card-title">Register</h5>

                        <form th:action="@{/register}" th:object="${registrationModel}" method="post" id="registrationForm">
                            <!-- First Name -->
                            <div class="mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required placeholder="Enter your full name">
                            </div>
                            <!-- Last Name -->
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required placeholder="Enter your last name">
                            </div>
                            <!-- Username -->

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required placeholder="Enter your username">
                            </div>
                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Enter your password" 
                                minlength="8" maxlength="30" required> <small class="form-text text-muted"><span style="color: red;">Password must be at least 8 characters long</span></small>
                            </div>
                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required placeholder="Enter your email">
                            </div>
                            <!-- Phone Number -->
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label">Phone Number</label>
                                <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" required placeholder="Enter your phone number">
                            </div>
                            <!-- Submit Button -->
                            <div class="mb-3 justify-content-center d-flex">
                            <button type="submit" class="btn btn-primary">Register</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
