<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Kits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kits.css">

</head>
<body>
    <header class="site-header">
        <div class="container-fluid px-3 d-flex align-items-center justify-content-between py-2">
            <a th:href="@{/}" aria-label="Crafted That home">
                <img class="brand-logo" th:src="@{/images/KatieCraftedThatLogo_Transparent.png}" alt="Crafted That">
            </a>
            <a class="btn ms-auto border-0" th:href="@{/home}">
                <img src="/images/home.svg" alt="Home" style="width: 40px; height: 40px; filter: invert(0%);">
            </a>
            <button class="view-cart-btn" id="open-cart" type="button" aria-haspopup="dialog" aria-controls="cart-panel">
                View Cart <span class="cart-count" id="cart-count" aria-live="polite">0</span>
            </button>
       
        </div>
    </header>

    <!-- Main content -->
    <main class="container pb-5">
        <section class="page-intro text-center">
            <p class="text-uppercase fw-semibold text-secondary mb-2">Crafted That</p>
            <h1 class="fw-bold">Find a kit for your next project</h1>
            <p class="text-secondary mb-0">Choose the kind of crafting you would like to explore.</p>
        </section>

        <!-- Kit categories -->
        <section class="row g-4" aria-label="Kit categories">
            <div class="col-12 col-md-4" th:each="kit : ${kits}">
                <article class="card kit-card h-100" th:data-price="${kit.price}">
                    <img class="card-img-top kit-image"
                         th:src="@{/images/{filename}(filename=${kit.image})}"
                         th:alt="${kit.description}">

                                 <button type="button" class="add-item-btn">
                            Add to Cart
                                 </button>
                    <div class="card-body">
                        <h2 class="h5 fw-semibold" th:text="${kit.title}">Kit title</h2>
                        <p class="card-text text-secondary mb-0" th:text="${kit.description}">Kit description</p>
                        <p class="card-text text-primary mb-0" th:text="'$' + ${kit.price} + '.00'">$0.00</p>
                    </div>

                </article>
            </div>
        </section>

        <hr class="w-100 bg-dark my-5">

        <section aria-label="More kits">
            <h2 class="h3 fw-semibold mb-4">Kits</h2>
            <div class="row g-4">
                <div class="col-12 col-md-4" th:each="kit : ${moreKits}">
                    <article class="card kit-card h-100" th:data-price="${kit.price}">
                        <img class="card-img-top kit-image"
                             th:src="@{/images/{filename}(filename=${kit.image})}"
                             th:alt="${kit.description}">
                             
                        <button type="button" class="add-item-btn">
                            Add to Cart
                        </button>
                             
                        <div class="card-body">
                            <h3 class="h5 fw-semibold" th:text="${kit.title}">Kit title</h3>
                            <p class="card-text text-secondary mb-0" th:text="${kit.description}">Kit description</p>
                            <p class="card-text text-primary mb-0" th:text="'$' + ${kit.price} + '.00'">$0.00</p>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <!-- Cart backdrop and panel -->
    <div class="cart-backdrop" id="cart-backdrop" hidden></div>
    <aside class="cart-panel" id="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cart-title" hidden>
        <div class="cart-panel-header">
            <div>
                <p class="cart-eyebrow">Your selection</p>
                <h2 id="cart-title">Shopping Cart <span id="panel-cart-count">(0)</span></h2>
            </div>
            <button class="cart-close-btn" id="close-cart" type="button" aria-label="Close cart">&times;</button>
        </div>
        <p class="cart-empty" id="cart-empty">Your cart is empty.</p>
        <ul class="cart-items" id="cart-items" aria-live="polite"></ul>

        <!-- Cart total row -->
        <div class="cart-total-row">
            <span>Total</span>
            <strong id="cart-total" aria-live="polite">$0.00</strong>
        </div>
        <div class="d-flex justify-content-center">
            <button class="pay-btn" style="width: 35%; background-color: #007bff; color: white; border-radius: 8px; font-weight: 600; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); border: 0">Checkout</button>
        </div>
    </aside>

    <!-- Shared cart state and drawer behavior are used on Home and Kits. -->
    <script src="/js/cart.js"></script>

</body>
</html>
